name: Manual signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing green-main release tag, for example v0.2.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release contract and credentials
    runs-on: ubuntu-latest
    environment: release
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      ROTHBALD_UPDATER_PRIVATE_KEY: ${{ secrets.ROTHBALD_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require current main commit and matching existing tag
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Manual signed releases must be dispatched from main"
            exit 1
          }
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must use the vMAJOR.MINOR.PATCH.HOTFIX format"
            exit 1
          }
          [[ "$REQUESTED_TAG" == "v$VERSION" ]] || {
            echo "Requested tag must be v$VERSION"
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n 1 "$REQUESTED_TAG" 2>/dev/null || true)"
          [[ -n "$TAG_COMMIT" ]] || {
            echo "Tag $REQUESTED_TAG does not exist; create it only after main CI is green"
            exit 1
          }
          [[ "$TAG_COMMIT" == "$GITHUB_SHA" ]] || {
            echo "Tag $REQUESTED_TAG points to $TAG_COMMIT, not dispatched main commit $GITHUB_SHA"
            exit 1
          }
          for NAME in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_SIGNING_IDENTITY ROTHBALD_UPDATER_PRIVATE_KEY; do
            [[ -n "${!NAME:-}" ]] || {
              echo "$NAME is missing in the release environment"
              exit 1
            }
          done
          python scripts/validate_release_notes.py

  windows:
    name: Windows x64
    needs: preflight
    runs-on: windows-latest
    environment: release
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      ROTHBALD_BUILD_CHANNEL: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-windows.lock
            requirements-build-windows.lock
      - name: Validate tag
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:REQUESTED_TAG -ne "v$version") {
            throw "Requested tag must be v$version"
          }
          "ROTHBALD_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install bundled runtime tools
        run: choco install ffmpeg innosetup --no-progress -y
      - name: Install Python dependencies
        run: python -m pip install -r requirements-windows.lock -r requirements-build-windows.lock
      - name: Build Windows Vulkan transcription backend
        shell: pwsh
        run: ./scripts/build_whisper_cpp_windows.ps1
      - name: Verify source and tests
        shell: bash
        run: |
          python scripts/prepare_build.py
          npx --yes @ast-grep/cli@0.43.0 scan .
          npx --yes @ast-grep/cli@0.43.0 test
          python -m py_compile app_info.py hardware_check.py server.py transcribe_video.py prepare_semantic.py prepare_models.py model_manager.py release_notes.py update_manifest.py updater.py rothbald.py scripts/prepare_build.py scripts/generate_release_manifest.py scripts/generate_updater_key.py scripts/validate_release_notes.py
          node --check static/app.js
          python -m unittest discover -s tests -v
      - name: Build Windows application
        run: pyinstaller --noconfirm Rothbald.spec
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if (!(Test-Path -LiteralPath "dist/Rothbald/Rothbald.exe")) {
            throw "PyInstaller did not create Rothbald.exe"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found"
          }
          & $iscc "/DMyAppVersion=$version" "installer\Rothbald.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $installer = "release-assets/Rothbald-${version}-Windows-Setup.exe"
          if (!(Test-Path -LiteralPath $installer) -or (Get-Item $installer).Length -eq 0) {
            throw "Windows installer is missing or empty"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS Apple Silicon
    needs: preflight
    runs-on: macos-15
    environment: release
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      ROTHBALD_BUILD_CHANNEL: release
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-macos.lock
            requirements-build-macos.lock
      - name: Validate tag and release credentials
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$REQUESTED_TAG" == "v$VERSION" ]] || { echo "Requested tag must be v$VERSION"; exit 1; }
          for NAME in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_SIGNING_IDENTITY; do
            [[ -n "${!NAME:-}" ]] || { echo "$NAME is missing in the release environment"; exit 1; }
          done
          echo "ROTHBALD_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements-macos.lock -r requirements-build-macos.lock
      - name: Verify source and tests
        run: |
          python scripts/prepare_build.py
          npx --yes @ast-grep/cli@0.43.0 scan .
          npx --yes @ast-grep/cli@0.43.0 test
          python -m py_compile app_info.py hardware_check.py server.py transcribe_video.py prepare_semantic.py prepare_models.py model_manager.py release_notes.py update_manifest.py updater.py rothbald.py scripts/prepare_build.py scripts/generate_release_manifest.py scripts/generate_updater_key.py scripts/validate_release_notes.py
          node --check static/app.js
          python -m unittest discover -s tests -v
      - name: Import Developer ID certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/rothbald-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/rothbald-certificate.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          {
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
            echo "ORIGINAL_KEYCHAINS_PATH=$RUNNER_TEMP/rothbald-original-keychains.txt"
            echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_CERTIFICATE_PATH=$CERTIFICATE_PATH"
          } >> "$GITHUB_ENV"
          security list-keychains -d user > "$RUNNER_TEMP/rothbald-original-keychains.txt"
          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 --decode > "$CERTIFICATE_PATH" || { echo "APPLE_CERTIFICATE is not valid Base64"; exit 1; }
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"
          [[ -s "$CERTIFICATE_PATH" ]] || { echo "APPLE_CERTIFICATE decoded to an empty file"; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" || { echo "Keychain could not import APPLE_CERTIFICATE"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r LINE; do
            ITEM="${LINE#*\"}"
            ITEM="${ITEM%\"*}"
            [[ -z "$ITEM" ]] || ORIGINAL_KEYCHAINS+=("$ITEM")
          done < "$RUNNER_TEMP/rothbald-original-keychains.txt"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"
      - name: Build, sign, notarize, staple, and verify
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          pyinstaller --noconfirm Rothbald.spec
          APP_PATH="$PWD/dist/Rothbald.app"
          RELEASE_DIR="$PWD/release-assets"
          STAGING_DIR="$(mktemp -d "$RUNNER_TEMP/rothbald-dmg.XXXXXX")"
          mkdir -p "$RELEASE_DIR"
          codesign --force --deep --options runtime --timestamp --entitlements assets/macos-entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          SIGNATURE_INFO="$(codesign --display --verbose=4 "$APP_PATH" 2>&1)"
          grep -q "Authority=Developer ID Application:" <<<"$SIGNATURE_INFO"
          grep -q "flags=.*runtime" <<<"$SIGNATURE_INFO"
          grep -q "Timestamp=" <<<"$SIGNATURE_INFO"
          if codesign --display --entitlements :- "$APP_PATH" 2>/dev/null | grep -q "com.apple.security.get-task-allow"; then
            echo "Release bundle unexpectedly allows debugger attachment"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RELEASE_DIR/Rothbald-${VERSION}-Mac-Apple-Silicon.zip"
          ditto "$APP_PATH" "$STAGING_DIR/Rothbald.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          DMG_PATH="$RELEASE_DIR/Rothbald-${VERSION}-Mac-Apple-Silicon.dmg"
          hdiutil create -volname Rothbald -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          NOTARY_RESULT="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$DMG_PATH" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$NOTARY_RESULT"
          cat "$NOTARY_RESULT"
          python - "$NOTARY_RESULT" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "Accepted" or not result.get("id"):
              raise SystemExit("Apple notarization was not Accepted")
          PY
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -s "${ORIGINAL_KEYCHAINS_PATH:-}" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r LINE; do
              ITEM="${LINE#*\"}"
              ITEM="${ITEM%\"*}"
              [[ -z "$ITEM" ]] || ORIGINAL_KEYCHAINS+=("$ITEM")
            done < "$ORIGINAL_KEYCHAINS_PATH"
            [[ "${#ORIGINAL_KEYCHAINS[@]}" -eq 0 ]] || security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || true
          fi
          [[ -z "${SIGNING_KEYCHAIN_PATH:-}" ]] || security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          [[ -z "${SIGNING_CERTIFICATE_PATH:-}" ]] || rm -f "$SIGNING_CERTIFICATE_PATH"
          [[ -z "${APPLE_API_KEY_PATH:-}" ]] || rm -f "$APPLE_API_KEY_PATH"
          [[ -z "${ORIGINAL_KEYCHAINS_PATH:-}" ]] || rm -f "$ORIGINAL_KEYCHAINS_PATH"

  publish-draft:
    name: Assemble draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and verify release manifest
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_ASSETS_DIR: release-assets
          ROTHBALD_UPDATER_PRIVATE_KEY: ${{ secrets.ROTHBALD_UPDATER_PRIVATE_KEY }}
        run: |
          python -m pip install cryptography==49.0.0
          python scripts/generate_release_manifest.py
          test -s release-assets/latest.json
          test -s release-assets/SHA256SUMS.txt
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            [[ "$IS_DRAFT" == "true" ]] || { echo "Release $TAG is already published; refusing to overwrite it"; exit 1; }
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --title "Rothbald ${TAG#v}"
          else
            gh release create "$TAG" --verify-tag --draft --title "Rothbald ${TAG#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" release-assets/* --clobber
