name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    env:
      ROTHBALD_BUILD_CHANNEL: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: Rothbald-Apple-Silicon
            artifact_path: Rothbald-Apple-Silicon.zip
          - os: windows-latest
            artifact: Rothbald-Windows-x64
            artifact_path: release-assets/Rothbald_*_windows-x86_64-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg innosetup --no-progress -y
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Verify source and tests
        shell: bash
        run: |
          python scripts/prepare_build.py
          python -m py_compile app_info.py server.py transcribe_video.py prepare_semantic.py prepare_models.py model_manager.py rothbald.py scripts/prepare_build.py scripts/generate_release_manifest.py
          node --check static/app.js
          python -m unittest discover -s tests -v
      - name: Build native bundle
        run: pyinstaller --noconfirm Rothbald.spec
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Rothbald.app Rothbald-Apple-Silicon.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found"
          }
          & $iscc "/DMyAppVersion=$version" "installer\Rothbald.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
