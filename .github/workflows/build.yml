name: test-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    env:
      ROTHBALD_BUILD_CHANNEL: ci
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-15' && '14.0' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            lockfile: requirements-macos.lock
            build_lockfile: requirements-build-macos.lock
            artifact: Rothbald-Apple-Silicon
            artifact_path: Rothbald-Apple-Silicon.zip
          - os: windows-latest
            lockfile: requirements-windows.lock
            build_lockfile: requirements-build-windows.lock
            artifact: Rothbald-Windows-x64
            artifact_path: release-assets/Rothbald-*-Windows-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.lockfile }}
            ${{ matrix.build_lockfile }}
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg innosetup --no-progress -y
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r ${{ matrix.lockfile }} -r ${{ matrix.build_lockfile }}
      - name: Install pinned JavaScript build tools
        run: npm ci
      - name: Build Windows Vulkan transcription backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/prepare_ffmpeg_windows.ps1
          ./scripts/build_whisper_cpp_windows.ps1
      - name: Verify source and tests
        shell: bash
        run: |
          python scripts/prepare_build.py
          npm run scan
          npm run scan:test
          python -m py_compile app_info.py hardware_check.py server.py transcribe_video.py prepare_semantic.py prepare_models.py model_manager.py release_notes.py update_manifest.py updater.py native_update.py rothbald.py scripts/prepare_build.py scripts/generate_release_manifest.py scripts/generate_updater_key.py scripts/smoke_packaged.py scripts/validate_release_notes.py scripts/versioning.py
          node --check static/app.js
          node --check static/update_flow.js
          node --test tests/test_update_flow.cjs
          python scripts/validate_release_notes.py
          python scripts/versioning.py check
          python -m unittest discover -s tests -v
      - name: Build native bundle
        run: pyinstaller --noconfirm Rothbald.spec
      - name: Smoke-test packaged application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python scripts/smoke_packaged.py dist/Rothbald.app/Contents/MacOS/Rothbald
          else
            python scripts/smoke_packaged.py dist/Rothbald/Rothbald.exe
          fi
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Rothbald.app Rothbald-Apple-Silicon.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found"
          }
          & $iscc "/DMyAppVersion=$version" "installer\Rothbald.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1
